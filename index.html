<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GMP 가이던스 뽀개기</title>
<meta name="description" content="완제의약품 제조 및 품질관리기준(GMP) 가이던스 제2장 4~9 빈칸 학습지와 형성평가">
<meta name="theme-color" content="#1d5a85">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GMP 뽀개기">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one document-width reading column under a sticky progress bar; 규정 set in the guidance's grey folded-corner box, 해설 as plain running text. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #1b2530;
  --muted: #5a6570;
  --rule: #d6dad4;
  --accent: #1d5a85;
  --accent-ink: #ffffff;
  --accent-soft: #e4eef6;
  --reg: #e8ebee;
  --reg-edge: #b4bcc6;
  --line: #7b8894;
  --stamp: #a83a2e;
  --ok: #2b7549;
  --ok-soft: #e5f2ea;
  --bad-soft: #f7e7e4;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-doc: "Gowun Batang", "AppleMyungjo", "Batang", "Noto Serif KR", serif;
  --bar-h: 6.2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #182028; --ink: #e3e8ec; --muted: #9aa6b1; --rule: #2b353e;
    --accent: #79b4df; --accent-ink: #0d1a24; --accent-soft: #1b3346; --reg: #212a33; --reg-edge: #46525e;
    --line: #8c99a5; --stamp: #e47a6d; --ok: #6cc28f; --ok-soft: #173326; --bad-soft: #3a211d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #182028; --ink: #e3e8ec; --muted: #9aa6b1; --rule: #2b353e;
  --accent: #79b4df; --accent-ink: #0d1a24; --accent-soft: #1b3346; --reg: #212a33; --reg-edge: #46525e;
  --line: #8c99a5; --stamp: #e47a6d; --ok: #6cc28f; --ok-soft: #173326; --bad-soft: #3a211d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--rule); }
.topbar-in { max-width: 48rem; margin: 0 auto; padding: 0.55rem 16px 0.6rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.45rem; }
.bar-row, .prog { min-width: 0; }
.bar-row { display: flex; align-items: center; gap: 0.5rem; }
.brand { border: 0; background: none; padding: 0; font-family: var(--f-doc); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; text-align: left; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: 0.72rem; color: var(--muted); margin-left: 0.35rem; }
.chip-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
.chip-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.prog { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.7rem; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog b { color: var(--ink); font-weight: 700; }
.prog .rem b { color: var(--stamp); }
.meter { flex: 1 1 4rem; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; min-width: 3rem; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

/* ---------- page ---------- */
main { max-width: 48rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.2rem 4rem; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* home */
.cover { padding-block: 1.6rem 1.4rem; border-bottom: 3px double var(--rule); display: grid; gap: 0.7rem; }
.cover h1 { font-family: var(--f-doc); font-weight: 700; font-size: clamp(1.7rem, 6vw, 2.5rem); margin: 0; letter-spacing: -0.02em; }
.cover h1 span { display: block; font-size: 0.55em; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-bottom: 0.2rem; }
.cover p { margin: 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.4rem; }
.btn { border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 0.5rem; padding: 0.7rem 1.1rem; font-weight: 700; font-size: 0.98rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--rule); color: var(--ink); }
.stat-line { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; font-size: 0.9rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.stat-line b { color: var(--ink); }
.stat-line .rem b { color: var(--stamp); }

.block { padding-block: 1.6rem 0.4rem; scroll-margin-top: calc(var(--bar-h) + 0.5rem); }
.block > h2 { font-family: var(--f-doc); font-size: 1.3rem; margin: 0 0 0.2rem; }
.block > p.lead { margin: 0 0 0.9rem; color: var(--muted); font-size: 0.9rem; }

.toc { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc .part { font-family: var(--f-doc); font-weight: 700; color: var(--accent); margin-top: 0.9rem; padding-block: 0.2rem; }
.toc-row { display: flex; align-items: baseline; gap: 0.45rem; width: 100%; border: 0; background: none; padding: 0.35rem 0; text-align: left; font-size: 0.95rem; color: var(--muted); }
.toc-row .no { font-variant-numeric: tabular-nums; flex: none; }
.toc-row .t { min-width: 0; }
.toc-row .dots { flex: 1; border-bottom: 1px dotted var(--line); min-width: 1rem; transform: translateY(-0.3em); opacity: .7; }
.toc-row .pg { font-variant-numeric: tabular-nums; flex: none; }
.toc-row.sub { padding-left: 1.4rem; }
.toc-row.chap { font-weight: 600; }
button.toc-row { color: var(--ink); }
button.toc-row .t { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 0.25em; }
button.toc-row:hover .t { text-decoration-color: var(--accent); color: var(--accent); }
.lchip { flex: none; font-size: 0.72rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0.05rem 0.5rem; white-space: nowrap; }

.lessons { display: grid; gap: 0.5rem; }
.lrow { display: grid; grid-template-columns: 3.2rem 1fr auto; align-items: center; gap: 0.7rem; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 0.55rem; padding: 0.65rem 0.8rem; }
.lrow .n { font-family: var(--f-doc); font-weight: 700; font-size: 1.05rem; color: var(--accent); white-space: nowrap; }
.lrow .what { min-width: 0; font-size: 0.9rem; line-height: 1.45; }
.lrow .what small { display: block; color: var(--muted); font-size: 0.78rem; }
.lrow .cnt { font-size: 0.78rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.4; }
.lrow .cnt b { color: var(--ink); }
.lrow.done { border-color: var(--ok); }
.lrow.done .cnt b { color: var(--ok); }

.reset { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; font-size: 0.85rem; color: var(--muted); }
.reset button { border: 1px solid var(--rule); background: var(--surface); border-radius: 0.4rem; padding: 0.35rem 0.7rem; font-size: 0.85rem; }
.reset button.danger { border-color: var(--stamp); color: var(--stamp); }
.source { margin-top: 1.4rem; font-size: 0.8rem; color: var(--muted); }

/* lesson */
.lhead { display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 1rem; align-items: end; padding-block: 0.6rem 1rem; border-bottom: 3px double var(--rule); }
.lhead .big { grid-row: span 3; font-family: var(--f-doc); font-weight: 700; font-size: 3.4rem; line-height: 1; color: var(--accent); }
.lhead .big small { display: block; font-family: var(--f-body); font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; margin-top: 0.3rem; }
.lhead .chapter { font-size: 0.8rem; color: var(--muted); }
.lhead h1 { font-family: var(--f-doc); font-size: 1.25rem; margin: 0; }
.lhead h1 span { display: block; }
.lhead .meta { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0.1rem 0.9rem; }
.lhead .meta b { color: var(--ink); }
.lhead .meta .rem b { color: var(--stamp); }

.sec { margin-top: 2rem; }
.sec > h2 { font-family: var(--f-doc); font-size: 1.35rem; margin: 0 0 0.3rem; padding-bottom: 0.35rem; border-bottom: 2px solid var(--accent); scroll-margin-top: calc(var(--bar-h) + 0.6rem); }
.sec > h2 small { font-family: var(--f-body); font-size: 0.8rem; color: var(--muted); font-weight: 500; margin-left: 0.4rem; }
.unit { margin-top: 1.4rem; }
.cite { text-align: right; font-size: 0.74rem; color: var(--muted); margin-bottom: 0.3rem; font-variant-numeric: tabular-nums; }
.reg { position: relative; background: var(--reg); padding: 0.9rem 1rem 0.95rem 1.1rem; font-family: var(--f-doc); font-size: 1.04rem; }
.reg::before, .reg::after { content: ""; position: absolute; width: 0; height: 0; border-style: solid; }
.reg::before { top: 0; left: 0; border-width: 15px 15px 0 0; border-color: var(--reg-edge) transparent transparent transparent; }
.reg::after { bottom: 0; right: 0; border-width: 0 0 15px 15px; border-color: transparent transparent var(--reg-edge) transparent; }
.reg .tag { display: block; font-family: var(--f-body); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); margin: 0 0 0.25rem; }
.exp { display: inline-flex; align-items: center; margin: 1rem 0 0.4rem; padding: 0.05rem 0.75rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 0.3rem 0.3rem 0.3rem 0; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.35em; }
.para { margin: 0 0 0.45rem; }
.para.h { font-weight: 700; text-align: center; }
.para.en { font-size: 0.9rem; color: var(--muted); word-break: normal; }
.box { margin: 0.8rem 0 0.9rem; border: 1px solid var(--line); padding: 0.85rem 0.9rem 0.5rem; background: var(--surface); }
.tbl { overflow-x: auto; margin: 0.4rem 0 0.7rem; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
.tbl td { border: 1px solid var(--rule); padding: 0.45rem 0.55rem; vertical-align: top; }
.tbl tr:first-child td { background: var(--reg); text-align: center; font-weight: 700; }
.tbl .para { margin: 0 0 0.2rem; }

.blank { font: inherit; font-size: max(1em, 16px); font-family: var(--f-body); font-weight: 600; color: var(--accent); background: transparent; border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 0 0.15em; margin: 0 0.12em; height: 1.55em; line-height: 1.55em; vertical-align: baseline; min-width: 2.6em; max-width: 100%; text-indent: 0; }
.blank.filled { background: var(--accent-soft); border-bottom-color: var(--accent); }
.blank:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--accent-soft); }
.blank[readonly] { cursor: default; }

.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.6rem; margin-top: 2.4rem; padding-top: 1rem; border-top: 3px double var(--rule); }
.pager .btn { flex: 1 1 9rem; }
.chq { margin-top: 1rem; padding: 0.9rem 1rem; border: 1px dashed var(--accent); border-radius: 0.55rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; justify-content: space-between; }
.chq p { margin: 0; font-size: 0.92rem; }

/* quiz */
.qtabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0 0.2rem; }
.qtabs button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.85rem; font-weight: 600; }
.qtabs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.qcards { display: grid; gap: 0.6rem; }
.qcard { display: grid; grid-template-columns: auto 1fr; gap: 0.8rem; align-items: start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 0.6rem; padding: 0.85rem 1rem; }
.qcard .cn { font-family: var(--f-doc); font-weight: 700; font-size: 1.6rem; color: var(--accent); line-height: 1.1; min-width: 1.6rem; }
.qcard .ct { font-weight: 700; }
.qcard .cs { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.qlist { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: 0.75rem; counter-reset: q; }
.q { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: 0.45rem; padding: 0.75rem 0.9rem 0.8rem; }
.q .qn { font-weight: 700; color: var(--accent); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.q .qs { font-size: 0.76rem; color: var(--muted); margin-left: 0.4rem; }
.q p { margin: 0.25rem 0 0; font-family: var(--f-doc); font-size: 1.03rem; }
.q.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.q.bad { border-left-color: var(--stamp); background: var(--bad-soft); }
.q .verdict { margin-top: 0.35rem; font-size: 0.85rem; font-weight: 700; }
.q.ok .verdict { color: var(--ok); }
.q.bad .verdict { color: var(--stamp); }
.score { margin-top: 1.1rem; padding: 1rem; border: 2px solid var(--accent); border-radius: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center; justify-content: space-between; }
.score .big { font-family: var(--f-doc); font-size: 1.6rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.qfoot { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.1rem; }
.qfoot .btn { flex: 1 1 9rem; }
.hint { font-size: 0.85rem; color: var(--muted); }
.namebox { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.7rem; margin: 0.2rem 0 0.1rem; }
.namebox label { font-weight: 700; font-size: 0.95rem; }
.namebox input { font: inherit; font-size: 16px; width: 11rem; max-width: 100%; padding: 0.45rem 0.65rem; border: 1.5px solid var(--line); border-radius: 0.45rem; background: var(--surface); color: var(--ink); }
.namebox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.namebox .need { font-size: 0.82rem; color: var(--stamp); font-weight: 600; }
.prog .who { color: var(--ink); font-weight: 700; max-width: 6rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .who { font-weight: 700; }
.chip-btn.save { border-color: var(--accent); color: var(--accent); }
.warn { background: var(--bad-soft); color: var(--ink); font-size: 0.8rem; line-height: 1.45; padding: 0.4rem 0.6rem; border-radius: 0.35rem; }
.warn button { border: 0; background: none; padding: 0; color: var(--stamp); font-weight: 700; text-decoration: underline; font-size: inherit; }
.savestrip { margin-top: 1rem; padding: 0.85rem 1rem; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 0.55rem; display: grid; gap: 0.55rem; }
.savestrip p { margin: 0; font-size: 0.9rem; line-height: 1.5; }
.savestrip .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.savestrip .row .btn { flex: 1 1 9rem; padding: 0.6rem 0.9rem; }
.savestat { font-size: 0.85rem; font-weight: 600; color: var(--ok); min-height: 1.2em; }
.savestat.err { color: var(--stamp); }
.savecard { background: var(--surface); border: 1px solid var(--rule); border-radius: 0.6rem; padding: 1rem; display: grid; gap: 0.6rem; margin-top: 0.9rem; }
.savecard h3 { margin: 0; font-size: 1.02rem; }
.savecard h3 span { display: inline-block; min-width: 1.6rem; color: var(--accent); font-family: var(--f-doc); }
.savecard p { margin: 0; font-size: 0.9rem; color: var(--muted); line-height: 1.55; }
.savecard textarea { width: 100%; min-height: 5.5rem; font: 0.8rem/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 16px; padding: 0.55rem 0.65rem; border: 1.5px solid var(--line); border-radius: 0.45rem; background: var(--bg); color: var(--ink); resize: vertical; word-break: break-all; }
.savecard textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.savecard .btn { justify-self: start; }
.savesum { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; font-size: 0.9rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.savesum b { color: var(--ink); }
</style>

<header class="topbar" id="topbar">
  <div class="topbar-in">
    <div class="bar-row">
      <button class="brand" id="go-home" type="button">GMP 가이던스 뽀개기<small id="where"></small></button>
      <button class="chip-btn" id="go-toc" type="button">목차</button>
      <button class="chip-btn save" id="go-save" type="button">저장</button>
      <button class="chip-btn primary" id="go-quiz" type="button">형성평가</button>
    </div>
    <div class="warn" id="store-warn" hidden>이 브라우저는 입력한 답을 자동으로 저장하지 못합니다. 페이지를 나가기 전에 <button type="button" id="warn-save">저장 코드를 복사</button>해 두세요.</div>
    <div class="prog" aria-live="polite">
      <span class="who" id="p-name" hidden></span>
      <span>채운 빈칸 <b id="p-fill">0</b></span>
      <span class="rem">남은 빈칸 <b id="p-rem">0</b></span>
      <span class="meter" aria-hidden="true"><i id="p-bar"></i></span>
    </div>
  </div>

    pager.setAttribute("aria-label", "차시 이동");
    if (no > 1) {
      var pv = el("button", "btn ghost", "← " + (no - 1) + "차시"); pv.type = "button";
      pv.addEventListener("click", function () { location.hash = "l" + (no - 1); });
      pager.appendChild(pv);
    }
    var tc = el("button", "btn ghost", "목차"); tc.type = "button";
    tc.addEventListener("click", function () { pending = "toc"; location.hash = "home"; });
    pager.appendChild(tc);
    if (no < L.length) {
      var nx = el("button", "btn primary", (no + 1) + "차시 →"); nx.type = "button";
      nx.addEventListener("click", function () { location.hash = "l" + (no + 1); });
      pager.appendChild(nx);
    }
    app.appendChild(pager);
    app.appendChild(saveStrip());
    updateCounts();
    settle();
  }

  function saveStrip() {
    var box = el("section", "savestrip");
    if (STORAGE_OK) {
      box.appendChild(el("p", null, "입력한 답은 이 휴대폰(브라우저)에 자동으로 저장됩니다. 다른 휴대폰이나 컴퓨터로 옮길 때만 저장 코드를 쓰면 됩니다."));
      var only = el("div", "row");
      var go = el("button", "btn", "저장 코드 화면"); go.type = "button";
      go.addEventListener("click", function () { location.hash = "save"; });
      only.appendChild(go);
      box.appendChild(only);
      return box;
    }
    box.appendChild(el("p", null, "이 브라우저는 답을 자동 저장하지 못합니다. 수업을 마치기 전에 저장 코드를 복사해 두세요. 다음에 '저장' 화면에서 붙여넣으면 입력한 답이 그대로 돌아옵니다."));
    var row = el("div", "row");
    var cp = el("button", "btn primary", "저장 코드 복사"); cp.type = "button";
    var ld = el("button", "btn", "저장 코드 불러오기"); ld.type = "button";
    row.appendChild(cp); row.appendChild(ld);
    box.appendChild(row);
    var stat = el("div", "savestat");
    stat.setAttribute("aria-live", "polite");
    box.appendChild(stat);
    var ta = el("textarea"); ta.readOnly = true; ta.hidden = true; ta.id = "strip-code";
    ta.setAttribute("aria-label", "저장 코드");
    ta.className = "stripcode";
    ta.style.cssText = "width:100%;min-height:4.5rem;font-size:16px;word-break:break-all;border:1.5px solid var(--line);border-radius:0.45rem;background:var(--surface);color:var(--ink);padding:0.5rem";
    box.appendChild(ta);
    cp.addEventListener("click", function () { copyCode(stat, ta); });
    ld.addEventListener("click", function () { location.hash = "save"; });
    return box;
  }

  function showSave() {
    setWhere("저장");
    app.innerHTML = "";
    var b = el("section", "block");
    b.style.paddingTop = "0.4rem";
    b.appendChild(el("div", "eyebrow", "답안 보관"));
    b.appendChild(el("h2", null, "저장 코드로 답안 옮기기"));
    b.appendChild(el("p", "lead", "입력한 답은 이 기기의 브라우저에 자동으로 저장됩니다. 다른 휴대폰이나 컴퓨터로 옮길 때, 또는 브라우저 기록을 지우기 전에 저장 코드를 복사해 두었다가 붙여넣으면 이름, 학습지 빈칸, 형성평가 답과 점수가 모두 돌아옵니다. 예전 claude.ai 링크에서 복사한 저장 코드도 여기서 불러올 수 있습니다."));
    var f = filledAll();
    var sum = el("div", "savesum");
    sum.innerHTML = "<span>이름 <b>" + (store.name ? "" : "미입력") + "</b></span><span>채운 빈칸 <b>" + NF.format(f) + "</b> / " + NF.format(TOTAL) + "</span><span>채점한 형성평가 <b>" + Object.keys(store.qres).length + "</b> / " + DATA.quiz.length + "</span>";
    if (store.name) sum.querySelector("b").textContent = store.name;
    b.appendChild(sum);

    var c1 = el("div", "savecard");
    var h1 = el("h3"); h1.appendChild(el("span", null, "1")); h1.appendChild(document.createTextNode("저장 코드 복사"));
    c1.appendChild(h1);
    c1.appendChild(el("p", null, "버튼을 누르면 지금까지 입력한 내용이 코드로 복사됩니다. 카카오톡 '나와의 채팅'이나 메모 앱에 붙여넣어 보관하세요. 답을 더 입력했다면 새로 복사해야 합니다."));
    var cp = el("button", "btn primary", "저장 코드 복사"); cp.type = "button";
    c1.appendChild(cp);
    var st1 = el("div", "savestat"); st1.setAttribute("aria-live", "polite");
    c1.appendChild(st1);
    var out = el("textarea"); out.id = "save-out"; out.readOnly = true; out.hidden = true;
    out.setAttribute("aria-label", "저장 코드");
    c1.appendChild(out);
    cp.addEventListener("click", function () { copyCode(st1, out); });
    b.appendChild(c1);

    var c2 = el("div", "savecard");
    var h2 = el("h3"); h2.appendChild(el("span", null, "2")); h2.appendChild(document.createTextNode("저장 코드 불러오기"));
    c2.appendChild(h2);
    c2.appendChild(el("p", null, "보관해 둔 저장 코드를 아래 칸에 붙여넣고 불러오기를 누르세요. 이 기기에 이미 입력한 답은 지워지지 않고, 코드에 있는 답이 더해집니다."));
    var inp = el("textarea"); inp.id = "save-in";
    inp.setAttribute("aria-label", "붙여넣을 저장 코드");
    inp.placeholder = "GMP1. 로 시작하는 저장 코드를 붙여넣으세요";
    inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "off"); inp.setAttribute("spellcheck", "false");
    c2.appendChild(inp);
    var ld = el("button", "btn primary", "불러오기"); ld.type = "button";
    c2.appendChild(ld);
    var st2 = el("div", "savestat"); st2.setAttribute("aria-live", "polite");
    c2.appendChild(st2);
    ld.addEventListener("click", function () {
      var o;
      try { o = readCode(inp.value); }
      catch (e) {
        st2.className = "savestat err";
        st2.textContent = e && e.message === "nolib"
          ? "코드를 풀 준비가 아직 안 됐습니다. 인터넷 연결을 확인하고 잠시 후 다시 눌러 주세요."
          : "코드를 읽지 못했습니다. GMP1. 부터 끝까지 빠짐없이 붙여넣었는지 확인하세요.";
        return;
      }
      var r = applyCode(o);
      st2.className = "savestat";
      st2.textContent = "불러왔습니다. 학습지 빈칸 " + NF.format(r.blanks) + "개, 채점한 형성평가 " + r.graded + "개" + (o.n ? " · 이름: " + o.n : "") + ".";
      inp.value = "";
      var sb = sum.querySelectorAll("b");
      sb[0].textContent = store.name || "미입력";
      sb[1].textContent = NF.format(filledAll());
      sb[2].textContent = String(Object.keys(store.qres).length);
    });
    b.appendChild(c2);

    var foot = el("div", "qfoot");
    var back = el("button", "btn ghost", store.last ? store.last + "차시 학습지로" : "처음 화면으로"); back.type = "button";
    back.addEventListener("click", function () { location.hash = store.last ? "l" + store.last : "home"; });
    foot.appendChild(back);
    b.appendChild(foot);
    app.appendChild(b);
    settle();
  }

  // ---------- quiz ----------
  function norm(s) { return String(s || "").normalize("NFC").replace(/[\s ㆍ·・‧∙•]/g, "").toLowerCase(); }
  function quizOf(ch) { for (var i = 0; i < DATA.quiz.length; i++) if (DATA.quiz[i].ch === ch) return DATA.quiz[i]; return null; }

  function showQuizHome() {
    setWhere("형성평가");
    app.innerHTML = "";
    var b = el("section", "block");
    b.style.paddingTop = "0.4rem";
    b.appendChild(el("h2", null, "형성평가"));
    b.appendChild(el("p", "lead", "챕터마다 10문항입니다. 가이던스 규정 원문과 해설의 빈칸에 들어갈 말을 쓰세요."));
    var cards = el("div", "qcards");
    DATA.quiz.forEach(function (q) {
      var c = el("button", "qcard"); c.type = "button";
      c.appendChild(el("span", "cn", q.ch));
      var w = el("span");
      w.appendChild(el("span", "ct", q.ch + ". " + q.t));
      var r = store.qres[q.ch];
      var answered = store.quiz[q.ch] ? Object.keys(store.quiz[q.ch]).length : 0;
      w.appendChild(el("span", "cs", " " + q.qs.length + "문항" + (r ? " · 최근 점수 " + r.score + "/" + q.qs.length : (answered ? " · 답한 문항 " + answered : ""))));
      w.querySelector(".cs").style.display = "block";
      c.appendChild(w);
      c.addEventListener("click", function () { location.hash = "q" + q.ch; });
      cards.appendChild(c);
    });
    b.appendChild(cards);
    var back = el("div", "qfoot");
    var hb = el("button", "btn ghost", "학습지로 돌아가기"); hb.type = "button";
    hb.addEventListener("click", function () { location.hash = store.last ? "l" + store.last : "home"; });
    back.appendChild(hb);
    b.appendChild(back);
    app.appendChild(b);
    settle();
  }

  function updateQuizCount(ch) {
    var e = document.getElementById("q-ans");
    if (!e) return;
    var q = quizOf(ch);
    var n = store.quiz[ch] ? Object.keys(store.quiz[ch]).length : 0;
    e.textContent = n + " / " + q.qs.length;
  }

  function showQuiz(ch, keepScroll) {
    var q = quizOf(ch);
    if (!q) { showQuizHome(); return; }
    setWhere("형성평가 " + ch + "장");
    app.innerHTML = "";
    var b = el("section", "block");
    b.style.paddingTop = "0.4rem";
    b.appendChild(el("div", "eyebrow", "형성평가"));
    b.appendChild(el("h2", null, ch + ". " + q.t));
    var tabs = el("div", "qtabs");
    DATA.quiz.forEach(function (o) {
      var t = el("button", null, o.ch + ". " + o.t); t.type = "button";
      if (o.ch === ch) t.setAttribute("aria-current", "page");
      t.addEventListener("click", function () { location.hash = "q" + o.ch; });
      tabs.appendChild(t);
    });
    b.appendChild(tabs);
    b.appendChild(nameField("quiz", false));
    var info = el("p", "hint");
    info.innerHTML = '빈칸에 알맞은 말을 쓰고 채점하기를 누르세요. <span style="white-space:nowrap">답한 문항 <b id="q-ans"></b></span>';
    b.appendChild(info);

    var res = store.qres[ch];
    var graded = !!res;
    var ol = el("ol", "qlist");
    q.qs.forEach(function (item, i) {
      var li = el("li", "q");
      var top = el("div");
      top.appendChild(el("span", "qn", "문제 " + (i + 1)));
      top.appendChild(el("span", "qs", item.src));
      li.appendChild(top);
      var p = el("p");
      p.appendChild(document.createTextNode(item.pre));
      var inp = document.createElement("input");
      inp.type = "text"; inp.className = "blank"; inp.id = "q" + ch + "-" + i;
      inp.setAttribute("data-q", ch + "-" + i);
      ["autocomplete", "autocapitalize", "autocorrect"].forEach(function (a) { inp.setAttribute(a, "off"); });
      inp.setAttribute("spellcheck", "false");
      inp.setAttribute("enterkeyhint", "next");
      inp.setAttribute("aria-label", "문제 " + (i + 1) + " 빈칸");
      inp.style.width = blankWidth(item.w + 1);
      var v = store.quiz[ch] && store.quiz[ch][i];
      if (v) { inp.value = v; inp.classList.add("filled"); }
      p.appendChild(inp);
      p.appendChild(document.createTextNode(item.post));
      li.appendChild(p);
      if (graded) {
        var ok = res.marks[i];
        li.classList.add(ok ? "ok" : "bad");
        inp.readOnly = true;
        li.appendChild(el("div", "verdict", ok ? "정답" : "오답 · 정답: " + item.a[0]));
      }
      ol.appendChild(li);
    });
    b.appendChild(ol);

    if (graded) {
      var sc = el("div", "score");
      var s1 = el("div");
      s1.appendChild(el("div", "hint", "채점 결과"));
      s1.appendChild(el("div", "big", res.score + " / " + q.qs.length));
      s1.appendChild(el("div", "hint", (res.name ? res.name + " · " : "") + ch + ". " + q.t + (res.at ? " · " + res.at : "")));
      sc.appendChild(s1);
      var again = el("button", "btn primary", "다시 풀기"); again.type = "button";
      again.addEventListener("click", function () { delete store.qres[ch]; store.quiz[ch] = {}; save(); showQuiz(ch); });
      sc.appendChild(again);
      b.appendChild(sc);
    }

    var foot = el("div", "qfoot");
    if (!graded) {
      var gb = el("button", "btn primary", "채점하기"); gb.type = "button";
      var msg = el("p", "hint"); msg.hidden = true;
      gb.addEventListener("click", function () {
        if (!store.name) {
          var nf = document.getElementById("name-quiz");
          var nd = nf && nf.parentNode.querySelector(".need");
          if (nd) nd.hidden = false;
          if (nf) { nf.focus(); nf.scrollIntoView({ block: "center" }); }
          return;
        }
        var ans = store.quiz[ch] || {};
        var n = Object.keys(ans).length;
        if (n < q.qs.length && msg.hidden) {
          msg.hidden = false;
          msg.textContent = "아직 " + (q.qs.length - n) + "문항이 비어 있습니다. 그대로 채점하려면 채점하기를 한 번 더 누르세요.";
          return;
        }
        var marks = q.qs.map(function (item, i) {
          var a = norm(ans[i]);
          return a !== "" && item.a.some(function (x) { return norm(x) === a; });
        });
        var now = new Date();
        var at = (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
        store.qres[ch] = { score: marks.filter(Boolean).length, marks: marks, name: store.name, at: at };
        save(); showQuiz(ch, true);
        var s = app.querySelector(".score"); if (s) s.scrollIntoView({ block: "center" });
      });
      foot.appendChild(gb);
      b.appendChild(foot);
      b.appendChild(msg);
      foot = el("div", "qfoot");
    }
    var ql = el("button", "btn ghost", "형성평가 목록"); ql.type = "button";
    ql.addEventListener("click", function () { location.hash = "quiz"; });
    var back = el("button", "btn ghost", "학습지로 돌아가기"); back.type = "button";
    back.addEventListener("click", function () {
      var first = 0;
      for (var i = 0; i < L.length; i++) if (chapterOf(L[i]) === ch) { first = L[i].no; break; }
      location.hash = "l" + (first || 1);
    });
    foot.appendChild(ql); foot.appendChild(back);
    b.appendChild(foot);
    app.appendChild(b);
    updateQuizCount(ch);
    if (!keepScroll) settle();
  }

  // ---------- routing ----------
  function route() {
    var h = (location.hash || "").replace(/^#/, "");
    if (/^l\d+$/.test(h)) showLesson(+h.slice(1));
    else if (h === "quiz") showQuizHome();
    else if (h === "save") showSave();
    else if (/^q[4-9]$/.test(h)) showQuiz(h.slice(1));
    else showHome();
  }
  window.addEventListener("hashchange", route);
  document.getElementById("go-home").addEventListener("click", function () {
    if (location.hash === "#home" || location.hash === "") showHome(); else location.hash = "home";
  });
  document.getElementById("go-toc").addEventListener("click", function () {
    pending = "toc";
    if (location.hash === "#home" || location.hash === "") showHome(); else location.hash = "home";
  });
  document.getElementById("go-quiz").addEventListener("click", function () { location.hash = "quiz"; });
  document.getElementById("go-save").addEventListener("click", function () { if (location.hash === "#save") showSave(); else location.hash = "save"; });
  document.getElementById("warn-save").addEventListener("click", function () { if (location.hash === "#save") showSave(); else location.hash = "save"; });

  function measureBar() {
    var h = document.getElementById("topbar").getBoundingClientRect().height;
    document.documentElement.style.setProperty("--bar-h", (h / 16).toFixed(2) + "rem");
  }
  window.addEventListener("resize", measureBar);
  window.addEventListener("load", measureBar);

  function start(seed) {
    loadStore(seed);
    STORAGE_OK = storageWorks();
    document.getElementById("store-warn").hidden = STORAGE_OK;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    showName();
    measureBar();
    updateCounts();
    route();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return store; }); } catch (e) {} }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
